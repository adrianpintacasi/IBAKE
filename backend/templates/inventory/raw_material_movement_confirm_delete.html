{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Delete Raw Material Movement</h2>
    <div class="alert alert-danger">
        Are you sure you want to delete movement <strong>{{ object.movement_number }}</strong> for <strong>{{ object.raw_material }}</strong>?
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-danger px-4">Confirm</button>
            <a href="{% url 'inventory:raw_material_movement_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
