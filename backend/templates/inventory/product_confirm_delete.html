{% extends 'base.html' %}
{% block title %}Delete Product - iBAKE Cakes & Pastries{% endblock %}
{% block content %}
<h2>Delete Product</h2>
<p>Are you sure you want to delete product <strong>{{ object.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'inventory:product_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
