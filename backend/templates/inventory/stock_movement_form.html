{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Stock Movement Form - iBAKE Cakes & Pastries{% endblock %}
{% block content %}
<h2>Add Stock Movement</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'inventory:stock_movement_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
