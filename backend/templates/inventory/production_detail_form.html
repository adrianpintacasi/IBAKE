{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{% if form.instance.pk %}Edit Ingredient{% else %}Add Ingredient{% endif %}</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="{{ form.raw_material.id_for_label }}" class="form-label">Raw Material</label>
                            {{ form.raw_material }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.quantity_used.id_for_label }}" class="form-label">Quantity Used</label>
                            {{ form.quantity_used }}
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="{{ form.unit.id_for_label }}" class="form-label">Unit</label>
                            {{ form.unit }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.source_batch.id_for_label }}" class="form-label">Source Batch</label>
                            {{ form.source_batch }}
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="{{ form.notes.id_for_label }}" class="form-label">Notes</label>
                    {{ form.notes }}
                </div>
                <div class="text-end">
                    <a href="{% url 'inventory:production_detail' production.pk %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
