{% extends 'base.html' %}

{% block title %}Logged Out - iBAKE Cakes & Pastries{% endblock %}

{% block extra_css %}
<style>
    body {
        background: #667eea;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .sidebar {
        display: none;
    }
    
    .main-content {
        margin-left: 0;
        padding: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .logout-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        max-width: 400px;
        width: 100%;
        text-align: center;
    }
    
    .logout-header {
        background: #667eea;
        color: white;
        padding: 2rem;
    }
    
    .logout-header h2 {
        margin: 0;
        font-weight: 600;
    }
    
    .logout-body {
        padding: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="logout-card">
    <div class="logout-header">
        <h2>iBAKE</h2>
        <p class="mb-0">Cafe Management System</p>
    </div>
    
    <div class="logout-body">
        <h4 class="mb-3">You have been logged out</h4>
        <p class="text-muted mb-4">Thank you for using iBAKE Cafe Management System.</p>
        
        <div class="d-grid gap-2">
            <a href="{% url 'login' %}" class="btn btn-primary">
                Login Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
