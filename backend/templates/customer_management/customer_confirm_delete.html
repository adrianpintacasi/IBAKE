{% extends 'base.html' %}
{% block title %}Delete Customer - iBAKE Cakes & Pastries{% endblock %}
{% block content %}
<h2>Delete Customer</h2>
<p>Are you sure you want to delete customer <strong>{{ object.first_name }} {{ object.last_name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'customer_management:customer_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
