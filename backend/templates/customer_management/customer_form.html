{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Customer Form - iBAKE Cakes & Pastries{% endblock %}
{% block content %}
<h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Customer</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'customer_management:customer_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
